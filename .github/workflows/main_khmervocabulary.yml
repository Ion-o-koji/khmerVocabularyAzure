name: Deploy to Azure Blob Static Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure $web container
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob sync \
              --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              --source . \
              --container '$web' \
              --exclude-path '.git*' 'server.js' 'package*.json' 'web.config' 'node_modules*'
